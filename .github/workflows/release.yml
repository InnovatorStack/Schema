name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: Version (for example 0.4.0)
                type: string
                required: true
                default: 0.4.0
            draft:
                description: Create a draft for review
                type: boolean
                default: true

permissions:
    contents: read

concurrency:
    group: release-${{ inputs.version }}
    cancel-in-progress: false

jobs:
    prepare:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Validate version and reject existing tags or releases
              env:
                  RELEASE_VERSION: ${{ inputs.version }}
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  python tools/package_release.py --validate-version "$RELEASE_VERSION"
                  gh api graphql -f owner="${GH_REPO%/*}" -f name="${GH_REPO#*/}" \
                    -f tag="v$RELEASE_VERSION" -f ref="refs/tags/v$RELEASE_VERSION" \
                    -f query='query($owner:String!,$name:String!,$tag:String!,$ref:String!) {
                      repository(owner:$owner,name:$name) {
                        release(tagName:$tag) { id }
                        ref(qualifiedName:$ref) { id }
                      }
                    }' | jq -e '.data.repository | .release == null and .ref == null'

    checks:
        needs: prepare
        uses: ./.github/workflows/checks.yml

    documentation:
        needs: prepare
        uses: ./.github/workflows/documentation-checks.yml

    build:
        needs: [checks, documentation]
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                framework: [net6.0, net8.0]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
              with:
                  global-json-file: global.json
            - name: Build and verify one archive
              env:
                  RELEASE_VERSION: ${{ inputs.version }}
                  TARGET_FRAMEWORK: ${{ matrix.framework }}
              run: |
                  dotnet restore src/InnovatorSchema --locked-mode \
                    --artifacts-path artifacts/build
                  dotnet build src/InnovatorSchema -c Release --no-restore \
                    -p:Version="$RELEASE_VERSION" \
                    -f "$TARGET_FRAMEWORK" --artifacts-path artifacts/build -o artifacts/library
                  python tools/package_release.py --version "$RELEASE_VERSION" \
                    --commit "$GITHUB_SHA" --framework "$TARGET_FRAMEWORK" \
                    --input artifacts/library --output artifacts/release
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: release-${{ matrix.framework }}
                  path: artifacts/release/*.zip
                  if-no-files-found: error
                  retention-days: 14

    release:
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: release-*
                  path: artifacts/release
                  merge-multiple: true
            - name: Verify the complete asset set and create the release
              env:
                  RELEASE_VERSION: ${{ inputs.version }}
                  DRAFT: ${{ inputs.draft }}
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  python tools/package_release.py --checksums --version "$RELEASE_VERSION" \
                    --commit "$GITHUB_SHA" --output artifacts/release
                  flags=()
                  if [[ "$DRAFT" == true ]]; then flags+=(--draft); fi
                  if [[ "$RELEASE_VERSION" == *-* ]]; then flags+=(--prerelease); fi
                  gh release create "v$RELEASE_VERSION" artifacts/release/* \
                    --target "$GITHUB_SHA" --title "Schema $RELEASE_VERSION" \
                    --notes-file .github/release-notes.md "${flags[@]}"
