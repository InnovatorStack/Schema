name: Documentation

on:
    push:
        branches: [main]
        paths:
            - 'docs/**'
            - 'examples/**'
            - 'tests/Fixtures/Assembly.xml'
            - 'tools/check-docs.mjs'
            - 'package.json'
            - 'package-lock.json'
            - '.github/workflows/documentation.yml'
    pull_request:
        paths:
            - 'docs/**'
            - 'examples/**'
            - 'tests/Fixtures/Assembly.xml'
            - 'tools/check-docs.mjs'
            - 'package.json'
            - 'package-lock.json'
            - '.github/workflows/documentation.yml'
    workflow_dispatch:
        inputs:
            publish:
                description: Publish to Pages (requires a public repository)
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: documentation
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Guard publication visibility
              if: inputs.publish
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  visibility=$(gh repo view "$GH_REPO" --json isPrivate --jq .isPrivate)
                  if [[ "$visibility" != false ]]; then
                    echo 'Pages publication is blocked while this repository is private.' >&2
                    exit 1
                  fi
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run docs:check
            - run: npm run docs:build
              env:
                  DOCS_BASE: /${{ github.event.repository.name }}/
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: documentation-preview
                  path: docs/.vitepress/dist
                  if-no-files-found: error
                  retention-days: 14
            - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              if: inputs.publish
              with:
                  path: docs/.vitepress/dist

    publish:
        if: inputs.publish && !github.event.repository.private
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
              id: deployment
